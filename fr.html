<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGENDARY KICKS</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

:root {
    --gold: #c9a96e;
    --bg: #070707;
    --line: rgba(201, 169, 110, .18);
}

body {
    background: var(--bg);
    color: #f4f1ea;
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* NAV */
nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 80px;
    padding: 0 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(7, 7, 7, .7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    z-index: 10;
}

.logo {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 8px;
}

.logo span { color: var(--gold); }

nav a {
    color: #bdb7a8;
    text-decoration: none;
    margin-left: 32px;
    font-size: 11px;
    letter-spacing: 4px;
    transition: color .3s;
}

nav a:hover { color: var(--gold); }

/* HERO */
.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 120px 30px 60px;
    background: radial-gradient(circle at 50% 55%, rgba(201,169,110,.12), transparent 60%);
}

.eyebrow {
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 10px;
    margin-bottom: 28px;
}

.hero h1 {
    font-size: clamp(48px, 10vw, 130px);
    font-weight: 200;
    letter-spacing: clamp(2px, 1vw, 14px);
    line-height: 1;
}

.hero h1 em {
    font-style: normal;
    color: var(--gold);
}

.shoe {
    font-size: clamp(90px, 20vw, 210px);
    margin: 45px 0 35px;
    filter: drop-shadow(0 30px 40px rgba(201, 169, 110, .25));
}

.hero p {
    color: #8d8879;
    font-size: 12px;
    letter-spacing: 6px;
}

.btn {
    display: inline-block;
    margin-top: 45px;
    padding: 17px 44px;
    border: 1px solid var(--gold);
    color: var(--gold);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 5px;
    transition: all .4s;
}

.btn:hover {
    background: var(--gold);
    color: #000;
}

/* ABOUT */
.about {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 30px;
    border-top: 1px solid var(--line);
}

.about h2 {
    font-size: clamp(32px, 6vw, 70px);
    font-weight: 200;
    letter-spacing: 6px;
}

.about .rule {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 30px 0;
}

.about p {
    color: #8d8879;
    letter-spacing: 3px;
    font-size: 13px;
}

/* FINGER */
.finger-section {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    overflow: hidden;
    border-top: 1px solid var(--line);
    background: radial-gradient(circle at 50% 100%, rgba(201,169,110,.1), transparent 65%);
}

.finger {
    font-size: clamp(220px, 55vw, 560px);
    line-height: .9;
    transform: translateY(105%);
    transition: transform 1.6s cubic-bezier(.2, .8, .2, 1);
    filter: drop-shadow(0 0 60px rgba(201, 169, 110, .3));
}

.finger-section.show .finger { transform: translateY(8%); }

footer {
    padding: 30px;
    text-align: center;
    color: #5f5b51;
    font-size: 11px;
    letter-spacing: 4px;
    border-top: 1px solid var(--line);
}
</style>
</head>

<body>

<nav>
    <div class="logo">LEGENDARY<span>.</span></div>
    <div>
        <a href="#home">HOME</a>
        <a href="#about">ABOUT</a>
    </div>
</nav>

<section class="hero" id="home">
    <div class="eyebrow">EST. 2026</div>
    <h1>BE <em>LEGENDARY</em></h1>
    <div class="shoe">👟</div>
    <p>NOT JUST SHOES. A LEGACY.</p>
    <a href="#about" class="btn">EXPLORE COLLECTION</a>
</section>

<section class="about" id="about">
    <h2>WALK YOUR OWN WAY</h2>
    <div class="rule"></div>
    <p>DESIGNED FOR LEGENDS. MADE FOR GREATNESS.</p>
</section>

<section class="finger-section" id="finger">
    <div class="finger">🖕</div>
</section>

<footer>
    © 2026 LEGENDARY KICKS. ALL RIGHTS RESERVED.
</footer>

<script>
const section = document.getElementById("finger");

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            section.classList.add("show");
        }
    });
}, { threshold: 0.4 });

observer.observe(section);
</script>

</body>
</html>
